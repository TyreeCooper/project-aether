name: Build and deploy Python app to Azure Web App - aether-prod-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aether-prod-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Run backend tests
        timeout-minutes: 5
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -vv
      - uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_530CF31F9C844B6BBFDBCED78DB6E9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C8115A17EE8945578F04F145FD68F4CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD212BE4448A497488FE91D5E47F27B6 }}
      - name: Verify deployment package
        run: |
          test -f startup.sh
          test -f requirements.txt
          test -f app/main.py
          echo "Deployment package verified."
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'aether-prod-api'
          slot-name: 'Production'
          package: .
      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          host="$(az webapp list --query "[?name=='aether-prod-api'].defaultHostName | [0]" -o tsv)"
          if [ -z "$host" ]; then
            echo "Could not resolve Azure defaultHostName for aether-prod-api."
            exit 1
          fi
          base="https://$host"
          echo "Verifying production runtime at $base"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 "$base/api/v1/health" >/tmp/aether-health.json; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production health endpoint did not recover after deploy."
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          with open("/tmp/aether-health.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert body.get("ok") is True, body
          assert body.get("paper_mode") is True, body
          assert body.get("live_blocked") is True, body
          PY

          echo "Waiting for AETHER-LOAD-003-B9 strategy-test runtime to become active..."
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 "$base/api/v1/floor" >/tmp/aether-floor-mode.json \
              && python -c 'import json; b=json.load(open("/tmp/aether-floor-mode.json", encoding="utf-8")); e=b.get("engine") or {}; assert e.get("runtime_release")=="AETHER-LOAD-003-B9"; assert e.get("runtime_mode") == "strategy_test"; assert e.get("strategy_test_mode") is True; assert e.get("execution_test_mode") is False; assert e.get("forced_entries_enabled") is False; assert e.get("live_blocked") is True; assert e.get("armed") is True; assert e.get("running") is True; assert e.get("accepting_entries") is True'; then
              echo "Expected strategy-test runtime is active."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Expected LOAD-003-B9 strategy-test runtime never became active."
              cat /tmp/aether-floor-mode.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error --max-time 20 "$base/" >/tmp/aether-root.html
          grep -q "Aether Trading Desk" /tmp/aether-root.html
          grep -q 'AETHER-LOAD-003-B9' /tmp/aether-root.html
          grep -q 'id="runExecutionMatrix"' /tmp/aether-root.html
          grep -q 'id="disconnectOperator"' /tmp/aether-root.html

          curl --fail --silent --show-error --max-time 20 "$base/static/aether-app.js?v=AETHER-LOAD-003-B9" >/tmp/aether-app.js
          grep -q 'Trade Duration' /tmp/aether-app.js
          grep -q 'operatorAuthenticated:false' /tmp/aether-app.js
          grep -q 'runExecutionMatrix' /tmp/aether-app.js
          grep -q 'Starting Bank' /tmp/aether-app.js
          grep -q 'Free Margin' /tmp/aether-app.js
          grep -q 'Gross Exposure' /tmp/aether-app.js
          grep -q 'STRATEGY TEST / PAPER' /tmp/aether-app.js
          grep -q 'EXECUTION VALIDATION' /tmp/aether-app.js
          grep -q 'position_risk_usd' /tmp/aether-app.js
          grep -q 'standard_lots' /tmp/aether-app.js
          grep -q '<th>MFE</th>' /tmp/aether-app.js
          grep -q '<th>Capture</th>' /tmp/aether-app.js

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/desk/live-trades" >/tmp/aether-live-trades.json
          python - <<'PY'
          import json
          with open("/tmp/aether-live-trades.json", encoding="utf-8") as fh:
              body = json.load(fh)
          runtime = body.get("runtime") or {}
          risk = body.get("risk") or {}
          assert runtime.get("runtime_release") == "AETHER-LOAD-003-B9", runtime
          assert runtime.get("runtime_mode") == "strategy_test", runtime
          assert runtime.get("strategy_test_mode") is True, runtime
          assert runtime.get("execution_test_mode") is False, runtime
          assert runtime.get("forced_entries_enabled") is False, runtime
          assert runtime.get("live_blocked") is True, runtime
          assert isinstance(body.get("strategy_open_count"), int), body
          assert isinstance(body.get("execution_validation_open_count"), int), body
          assert isinstance(body.get("items"), list), body
          assert isinstance(body.get("watch"), list), body
          assert isinstance(body.get("events"), list), body
          assert "open_stop_risk_usd" in risk, risk
          assert "remaining_portfolio_risk_usd" in risk, risk
          assert "max_portfolio_risk_usd" in risk, risk
          assert float(risk.get("open_stop_risk_usd") or 0) <= float(risk.get("max_portfolio_risk_usd") or 0) + 1e-6, risk
          for item in body["items"]:
              assert item.get("trade_class") in {"strategy", "execution_validation"}, item
              assert "position_risk_usd" in item, item
              assert "position_risk_pct_equity" in item, item
              if item.get("trade_class") == "execution_validation":
                  assert item.get("execution_test") is True, item
          for row in body["watch"]:
              assert row.get("trade_class") == "strategy", row
              assert row.get("route_key"), row
              assert row.get("gate_reason"), row
          PY

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/floor" >/tmp/aether-floor.json
          python - <<'PY'
          import json
          with open("/tmp/aether-floor.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert isinstance(body.get("assets"), list), body
          assert len(body["assets"]) == 12, len(body["assets"])
          portfolio = body.get("portfolio") or {}
          assert float(portfolio.get("starting_bank") or 0) == 300000.0, portfolio
          engine = body.get("engine") or {}
          assert engine.get("runtime_release") == "AETHER-LOAD-003-B9", engine
          assert engine.get("runtime_mode") == "strategy_test", engine
          assert engine.get("strategy_test_mode") is True, engine
          assert engine.get("execution_test_mode") is False, engine
          assert engine.get("forced_entries_enabled") is False, engine
          assert engine.get("armed") is True, engine
          assert engine.get("running") is True, engine
          assert engine.get("accepting_entries") is True, engine
          assert body.get("live_blocked") is True, body
          strategy_risk = portfolio.get("strategy_risk") or {}
          assert float(strategy_risk.get("open_stop_risk_usd") or 0) <= float(strategy_risk.get("max_portfolio_risk_usd") or 0) + 1e-6, strategy_risk
          PY

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/settings" >/tmp/aether-settings.json
          python - <<'PY'
          import json
          with open("/tmp/aether-settings.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert body.get("mode") == "paper", body
          desk = body.get("desk") or {}
          engine = body.get("engine") or {}
          risk = desk.get("strategy_risk_policy") or {}
          sizing = desk.get("instrument_sizing_policy") or {}
          intelligence = body.get("intelligence") or {}
          live = body.get("live") or {}
          assert desk.get("runtime_release") == "AETHER-LOAD-003-B9", desk
          assert desk.get("runtime_mode") == "strategy_test", desk
          assert desk.get("forced_entries_enabled") is False, desk
          assert engine.get("armed") is True, engine
          assert engine.get("accepting_entries") is True, engine
          assert risk.get("max_trade_risk_pct") == 0.75, risk
          assert risk.get("max_portfolio_risk_pct") == 3.0, risk
          assert risk.get("fixed_strategy_position_limit") is None, risk
          assert sizing.get("fx_max_standard_lots") == 1.0, sizing
          assert sizing.get("fx_max_base_units") == 100000.0, sizing
          assert sizing.get("micro_future_max_contracts") == 1.0, sizing
          assert sizing.get("equity_quantity_unit") == "shares", sizing
          assert sizing.get("crypto_quantity_unit") == "coin_quantity", sizing
          assert intelligence.get("community_trade_influence_enabled") is False, intelligence
          assert (intelligence.get("crypto_calendar") or {}).get("trade_influence_enabled") is False, intelligence
          assert (intelligence.get("event_policy") or {}).get("mode") == "observe_only", intelligence
          assert live.get("orders_enabled") is False, live
          assert live.get("live_blocked") is True, live
          PY

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/desk/execution-matrix" >/tmp/aether-matrix.json
          python - <<'PY'
          import json
          with open("/tmp/aether-matrix.json", encoding="utf-8") as fh:
              body = json.load(fh)
          cells = body.get("cells") or []
          assert len(cells) == 72, len(cells)
          assert body.get("long_supported_count") == 12, body
          assert body.get("short_supported_count") == 10, body
          assert sum(1 for row in cells if row.get("supported")) == 54, body
          assert sum(1 for row in cells if not row.get("supported")) == 18, body
          assert body.get("live_order_attempted") is False, body
          PY

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/load-status/aether-load-002" >/tmp/aether-load-002.json
          python - <<'PY'
          import json
          with open("/tmp/aether-load-002.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert body.get("release") == "AETHER-LOAD-002-EXP-R1", body
          assert body.get("runtime_safe") is True, body
          assert body.get("status") != "experiment_active", body
          assert body.get("filters_bypassed") is False, body
          experiment = body.get("experiment") or {}
          assert experiment.get("active") is False, experiment
          assert experiment.get("run_id") == "EXP-R1", experiment
          assert experiment.get("target_count") == 12, experiment
          checks = body.get("checks") or {}
          assert checks and all(checks.values()), checks
          matrix = body.get("matrix") or {}
          assert matrix.get("supported_cells") == 54, matrix
          assert matrix.get("unsupported_cells") == 18, matrix
          assert matrix.get("live_order_attempted") is False, matrix
          PY

          auth_code="$(curl --silent --show-error --max-time 20 -o /tmp/aether-auth.json -w '%{http_code}' -X POST "$base/api/v1/auth/verify")"
          if [ "$auth_code" != "401" ] && [ "$auth_code" != "503" ]; then
            echo "Unauthenticated operator verification unexpectedly returned HTTP $auth_code"
            cat /tmp/aether-auth.json || true
            exit 1
          fi
