name: Build and deploy Python app to Azure Web App - aether-prod-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_530CF31F9C844B6BBFDBCED78DB6E9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C8115A17EE8945578F04F145FD68F4CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD212BE4448A497488FE91D5E47F27B6 }}
      - name: Configure Azure startup command
        run: |
          az webapp config set \
            --resource-group aether-rg \
            --name aether-prod-api \
            --startup-file "bash startup.sh"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'aether-prod-api'
          slot-name: 'Production'
          package: .
