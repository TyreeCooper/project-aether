name: Build and deploy Python app to Azure Web App - aether-prod-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aether-prod-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Run backend tests
        timeout-minutes: 5
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -vv
      - uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_530CF31F9C844B6BBFDBCED78DB6E9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C8115A17EE8945578F04F145FD68F4CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD212BE4448A497488FE91D5E47F27B6 }}
      - name: Verify deployment package
        run: |
          test -f startup.sh
          test -f requirements.txt
          test -f app/main.py
          echo "Deployment package verified."
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'aether-prod-api'
          slot-name: 'Production'
          package: .
      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          host="$(az webapp list --query "[?name=='aether-prod-api'].defaultHostName | [0]" -o tsv)"
          if [ -z "$host" ]; then
            echo "Could not resolve Azure defaultHostName for aether-prod-api."
            exit 1
          fi
          base="https://$host"
          echo "Verifying production runtime at $base"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 "$base/api/v1/health" >/tmp/aether-health.json; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production health endpoint did not recover after deploy."
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          with open("/tmp/aether-health.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert body.get("ok") is True, body
          assert body.get("paper_mode") is True, body
          assert body.get("live_blocked") is True, body
          PY
          curl --fail --silent --show-error --max-time 20 "$base/" >/tmp/aether-root.html
          grep -q "Aether Trading Desk" /tmp/aether-root.html
          grep -q 'AETHER-LOAD-002-B7' /tmp/aether-root.html
          grep -q 'id="runExecutionMatrix"' /tmp/aether-root.html
          grep -q 'id="disconnectOperator"' /tmp/aether-root.html

          curl --fail --silent --show-error --max-time 20 "$base/static/aether-app.js?v=AETHER-LOAD-002-B7" >/tmp/aether-app.js
          grep -q 'Trade Duration' /tmp/aether-app.js
          grep -q 'operatorAuthenticated:false' /tmp/aether-app.js
          grep -q 'runExecutionMatrix' /tmp/aether-app.js
          grep -q 'Starting Bank' /tmp/aether-app.js
          grep -q 'Free Margin' /tmp/aether-app.js
          grep -q 'Gross Exposure' /tmp/aether-app.js

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/floor" >/tmp/aether-floor.json
          python - <<'PY'
          import json
          with open("/tmp/aether-floor.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert isinstance(body.get("assets"), list), body
          assert len(body["assets"]) == 12, len(body["assets"])
          portfolio = body.get("portfolio") or {}
          assert float(portfolio.get("starting_bank") or 0) == 300000.0, portfolio
          engine = body.get("engine") or {}
          assert engine.get("execution_test_mode") is False, engine
          assert body.get("live_blocked") is True, body
          PY

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/desk/execution-matrix" >/tmp/aether-matrix.json
          python - <<'PY'
          import json
          with open("/tmp/aether-matrix.json", encoding="utf-8") as fh:
              body = json.load(fh)
          cells = body.get("cells") or []
          assert len(cells) == 72, len(cells)
          assert body.get("long_supported_count") == 12, body
          assert body.get("short_supported_count") == 10, body
          assert sum(1 for row in cells if row.get("supported")) == 54, body
          assert sum(1 for row in cells if not row.get("supported")) == 18, body
          assert body.get("live_order_attempted") is False, body
          PY

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/load-status/aether-load-002" >/tmp/aether-load-002.json
          python - <<'PY'
          import json
          with open("/tmp/aether-load-002.json", encoding="utf-8") as fh:
              body = json.load(fh)
          assert body.get("release") == "AETHER-LOAD-002-B7", body
          assert body.get("ready") is True, body
          assert body.get("status") == "ready", body
          checks = body.get("checks") or {}
          assert checks and all(checks.values()), checks
          matrix = body.get("matrix") or {}
          assert matrix.get("supported_cells") == 54, matrix
          assert matrix.get("unsupported_cells") == 18, matrix
          assert matrix.get("live_order_attempted") is False, matrix
          PY

          auth_code="$(curl --silent --show-error --max-time 20 -o /tmp/aether-auth.json -w '%{http_code}' -X POST "$base/api/v1/auth/verify")"
          if [ "$auth_code" != "401" ] && [ "$auth_code" != "503" ]; then
            echo "Unauthenticated operator verification unexpectedly returned HTTP $auth_code"
            cat /tmp/aether-auth.json || true
            exit 1
          fi
