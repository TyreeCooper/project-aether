name: AETHER vNext Current-Head Readiness

on:
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  contents: read

concurrency:
  group: aether-vnext-current-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'aether-vnext-swapout' &&
      github.event.label.name == 'aether-vnext-burnin-readiness-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aether-vnext-burnin
    defaults:
      run:
        working-directory: backend
    env:
      AETHER_VNEXT_ENVIRONMENT: burnin
      AETHER_VNEXT_DATABASE_URL: ${{ secrets.AETHER_VNEXT_BURNIN_DATABASE_URL }}
      AETHER_VNEXT_AZURE_POSTGRESQL_CONNECTIONSTRING: ${{ secrets.AETHER_VNEXT_BURNIN_POSTGRESQL_CONNECTIONSTRING }}
      AETHER_VNEXT_RUNTIME_BINDINGS_JSON: ${{ secrets.AETHER_VNEXT_RUNTIME_BINDINGS_JSON }}
      AETHER_VNEXT_TRADINGHOURS_API_TOKEN: ${{ secrets.AETHER_VNEXT_TRADINGHOURS_API_TOKEN }}

    steps:
      - name: Checkout exact current PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify current-head identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          test "$GITHUB_HEAD_REF" = "aether-vnext-swapout"
          echo "current vNext readiness head: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run read-only current-head readiness audit
        id: readiness
        env:
          PYTHONPATH: .
          AETHER_BURNIN_CAMPAIGN_ID: aether-vnext-burnin-pr-${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          python scripts/aether_vnext_burnin_readiness.py \
            --campaign-id "$AETHER_BURNIN_CAMPAIGN_ID" \
            --output aether-vnext-current-head-readiness.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Attach exact revision to readiness result
        if: ${{ always() && steps.readiness.outcome == 'success' }}
        env:
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("aether-vnext-current-head-readiness.json")
          body = json.loads(path.read_text(encoding="utf-8"))
          body["source_revision"] = os.environ["DEPLOYED_SHA"]
          body["read_only"] = True
          path.write_text(
              json.dumps(body, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload current-head readiness
        if: ${{ always() && steps.readiness.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: aether-vnext-current-head-readiness-${{ github.run_id }}
          path: backend/aether-vnext-current-head-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagate readiness result
        if: ${{ steps.readiness.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "Current-head burn-in readiness is not green; inspect the JSON artifact."
          exit "${{ steps.readiness.outputs.exit_code }}"
