name: Aether Strategy Research

on:
  push:
    branches: [main]
    paths:
      - "backend/app/strategy.py"
      - "backend/app/learn.py"
      - "backend/app/research.py"
      - "backend/app/fees.py"
      - "backend/app/exits.py"
      - ".github/workflows/strategy_research.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of 1m BTC history to research"
        required: true
        default: "30"
      symbol:
        description: "Binance.US symbol"
        required: true
        default: "BTCUSD"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run strategy research
        env:
          PYTHONPATH: .
        run: |
          python scripts/research_strategy.py \
            --days "${{ inputs.days || '30' }}" \
            --symbol "${{ inputs.symbol || 'BTCUSD' }}" \
            --output strategy-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: aether-strategy-research-${{ inputs.days || '30' }}d
          path: backend/strategy-research.json
          if-no-files-found: error
