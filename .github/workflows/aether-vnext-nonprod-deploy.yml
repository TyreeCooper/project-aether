name: AETHER vNext Nonprod Deploy

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Existing Azure Web App name for non-production vNext testing"
        required: true
        type: string
      slot_name:
        description: "Existing non-production slot name; leave blank for a dedicated nonprod app"
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: "Exact aether-vnext-swapout commit SHA approved for deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aether-vnext-nonprod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref_name == 'aether-vnext-swapout' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aether-vnext-burnin

    steps:
      - name: Checkout authorized vNext revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify branch, revision, and nonproduction target
        id: target
        shell: bash
        env:
          REQUESTED_APP_NAME: ${{ inputs.app_name }}
          REQUESTED_SLOT_NAME: ${{ inputs.slot_name }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = "aether-vnext-swapout"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$actual" = "$GITHUB_SHA"

          app_name="$(printf '%s' "$REQUESTED_APP_NAME" | xargs)"
          slot_name="$(printf '%s' "$REQUESTED_SLOT_NAME" | xargs)"

          if [ -z "$app_name" ]; then
            echo "app_name is required."
            exit 2
          fi
          if [ "$app_name" = "aether-prod-api" ] && { [ -z "$slot_name" ] || [ "$slot_name" = "Production" ]; }; then
            echo "Direct deployment to aether-prod-api Production is forbidden."
            exit 2
          fi

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "slot_name=$slot_name" >> "$GITHUB_OUTPUT"
          echo "authorized revision: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Unified Firm Floor static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: ""
          NEXT_PUBLIC_AETHER_FLOOR_PATH: "/api/v1/vnext/floor"
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f out/index.html
          test -d out/_next

      - name: Embed exact vNext build identity
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          revision = os.environ["SOURCE_REVISION"].strip()
          if len(revision) != 40:
              raise SystemExit("SOURCE_REVISION must be a full commit SHA")
          payload = {
              "source_revision": revision,
              "package_built_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("backend/aether_vnext/build_manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Embed vNext UI into backend package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/app/vnext_ui
          mkdir -p backend/app/vnext_ui
          cp -R frontend/out/. backend/app/vnext_ui/
          test -f backend/app/vnext_ui/index.html
          test -d backend/app/vnext_ui/_next
          grep -q '/vnext/_next/' backend/app/vnext_ui/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package before Azure login
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q \
            tests_vnext/test_phase15_frontend_contract.py \
            tests_vnext/test_phase16_shadow_mount.py \
            tests_vnext/test_phase17_floor_test_status.py \
            tests_vnext/test_phase17_paper_test_reset.py
          test -f startup.sh
          test -f app/main.py
          test -f app/vnext_ui/index.html

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_530CF31F9C844B6BBFDBCED78DB6E9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C8115A17EE8945578F04F145FD68F4CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD212BE4448A497488FE91D5E47F27B6 }}

      - name: Resolve authorized Azure target
        id: azure_target
        shell: bash
        env:
          APP_NAME: ${{ steps.target.outputs.app_name }}
          SLOT_NAME: ${{ steps.target.outputs.slot_name }}
        run: |
          set -euo pipefail
          if [ -n "$SLOT_NAME" ]; then
            host="$(az webapp deployment slot list               --name "$APP_NAME"               --query "[?name=='$SLOT_NAME'].defaultHostName | [0]"               -o tsv)"
          else
            host="$(az webapp list               --query "[?name=='$APP_NAME'].defaultHostName | [0]"               -o tsv)"
          fi
          if [ -z "$host" ]; then
            echo "Requested Azure nonproduction target does not exist or is not visible."
            exit 2
          fi
          if [ "$host" = "aether-prod-api.azurewebsites.net" ]; then
            echo "Production hostname is forbidden."
            exit 2
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Deploy vNext nonproduction package
        if: ${{ steps.target.outputs.slot_name == '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.app_name }}
          package: backend

      - name: Deploy vNext nonproduction slot package
        if: ${{ steps.target.outputs.slot_name != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.app_name }}
          slot-name: ${{ steps.target.outputs.slot_name }}
          package: backend

      - name: Verify deployed paper-only vNext surface
        shell: bash
        env:
          HOST: ${{ steps.azure_target.outputs.host }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://$HOST"
          echo "Verifying vNext nonproduction deployment at $base"

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$base/api/v1/health" >/tmp/health.json; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Health endpoint did not recover."
              exit 1
            fi
            sleep 10
          done

          python - <<'PY'
          import json
          body=json.load(open("/tmp/health.json", encoding="utf-8"))
          assert body.get("ok") is True, body
          assert body.get("paper_mode") is True, body
          assert body.get("live_blocked") is True, body
          PY

          curl --fail --silent --show-error --max-time 20 "$base/vnext/" >/tmp/vnext.html
          grep -q "AETHER" /tmp/vnext.html

          curl --fail --silent --show-error --max-time 20 "$base/api/v1/vnext/floor" >/tmp/vnext-floor.json
          python - <<'PY'
          import json
          body=json.load(open("/tmp/vnext-floor.json", encoding="utf-8"))
          mode=body.get("mode") or {}
          assert mode.get("paper_only") is True, body
          assert mode.get("live_blocked") is True, body
          assert body.get("runtime_started_at_utc"), body
          build=body.get("build") or {}
          import os
          assert build.get("source_revision") == os.environ["EXPECTED_SHA"], build
          assert build.get("package_built_at_utc"), build
          paper_test=body.get("paper_test") or {}
          assert "seed_bank_usd" in paper_test, body
          assert "blotter_trade_count" in paper_test, body
          PY

          for method in POST PUT PATCH DELETE; do
            code="$(curl --silent --show-error --max-time 20 -o /tmp/mutation.json -w '%{http_code}' -X "$method" "$base/api/v1/vnext/floor")"
            test "$code" = "405"
          done

          echo "vNext nonproduction deployment verified."
