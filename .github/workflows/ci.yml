name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Run backend tests
        run: timeout --signal=TERM --kill-after=10s 300s python -m pytest -q -o faulthandler_timeout=60
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
