name: AETHER vNext Paper Reset Preview

on:
  push:
    branches:
      - aether-vnext-swapout
    paths:
      - ".github/workflows/aether-vnext-paper-reset-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: aether-vnext-burnin
    defaults:
      run:
        working-directory: backend
    env:
      AETHER_VNEXT_ENVIRONMENT: burnin
      AETHER_VNEXT_DATABASE_URL: ${{ secrets.AETHER_VNEXT_BURNIN_DATABASE_URL }}

    steps:
      - name: Checkout exact vNext head
        uses: actions/checkout@v4

      - name: Verify branch
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aether-vnext-swapout"
          echo "Reset preview head: $(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run read-only paper-test reset preview
        id: preview
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          python scripts/aether_vnext_new_test_reset.py             --epoch-id "aether-prototype-new-system-test-001"             --reason "whole new system / whole new tests"             --output aether-vnext-paper-reset-preview.json
          status=$?
          echo "preview_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify preview did not mutate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path("aether-vnext-paper-reset-preview.json").read_text())
          assert body["mode"] == "preview", body
          assert body["mutation_performed"] is False, body
          assert body["paper_only"] is True, body
          assert body["live_blocked"] is True, body
          print(json.dumps({
              "resettable": body["resettable"],
              "blockers": body["blockers"],
              "seed_bank_total_usd": body["seed_bank_total_usd"],
              "prior_state_hash": body["prior_state_hash"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload reset preview
        uses: actions/upload-artifact@v4
        with:
          name: aether-vnext-paper-reset-preview-${{ github.run_id }}
          path: backend/aether-vnext-paper-reset-preview.json
          if-no-files-found: error
          retention-days: 30
