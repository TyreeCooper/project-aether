name: AETHER vNext CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/aether_vnext/**'
      - 'backend/tests_vnext/**'
      - 'backend/alembic/versions/**'
      - 'docs/AETHER_VNEXT_PHASE0_CONTROL.md'
      - '.github/workflows/aether-vnext-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnext-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vnext-contract:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run isolated vNext tests
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q tests_vnext
      - name: Prove vNext live block and legacy isolation
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import sys
          import aether_vnext

          contract = aether_vnext.runtime_contract()
          assert contract["paper_only"] is True
          assert contract["live_blocked"] is True
          assert contract["legacy_compatibility_required"] is False

          legacy = [
              name for name in sys.modules
              if name == "app" or name.startswith("app.")
          ]
          assert legacy == [], legacy
          print("AETHER vNext isolation contract: GREEN")
          PY

  burnin-preflight-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: vnext-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aether-vnext-burnin
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    env:
      AETHER_VNEXT_ENVIRONMENT: burnin
      AETHER_VNEXT_DATABASE_URL: ${{ secrets.AETHER_VNEXT_BURNIN_DATABASE_URL }}
      AETHER_VNEXT_AZURE_POSTGRESQL_CONNECTIONSTRING: ${{ secrets.AETHER_VNEXT_BURNIN_POSTGRESQL_CONNECTIONSTRING }}

    steps:
      - name: Refuse default-branch burn-in execution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Pre-merge vNext burn-in bridge refuses main."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login for dedicated burn-in managed identity
        if: ${{ env.AETHER_VNEXT_AZURE_POSTGRESQL_CONNECTIONSTRING != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AETHER_VNEXT_BURNIN_CLIENT_ID }}
          tenant-id: ${{ secrets.AETHER_VNEXT_BURNIN_TENANT_ID }}
          subscription-id: ${{ secrets.AETHER_VNEXT_BURNIN_SUBSCRIPTION_ID }}

      - name: Validate isolated database configuration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from aether_vnext.db_runtime import VNextDatabaseConfig
          cfg = VNextDatabaseConfig.from_environment()
          print("vNext environment:", cfg.environment)
          print("connection mode:", "database-url" if cfg.database_url else "managed-identity")
          PY

      - name: Refuse legacy production database target
        env:
          PYTHONPATH: .
        run: python scripts/aether_vnext_check_db_isolation.py

      - name: Initialize isolated vNext book
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aether_vnext_migrate.py
          python scripts/aether_vnext_bootstrap_policy.py

      - name: Preflight full canonical eligible universe
        id: burnin_preflight
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          campaign_id="preflight-${GITHUB_SHA}"
          python scripts/aether_vnext_burnin_preflight.py \
            --campaign-id "$campaign_id" \
            --canonical-routes \
            --output aether-vnext-burnin-preflight.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload canonical burn-in preflight
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aether-vnext-burnin-preflight-${{ github.run_id }}
          path: backend/aether-vnext-burnin-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagate canonical preflight result
        if: ${{ steps.burnin_preflight.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "Canonical burn-in preflight is not startable; inspect the JSON artifact."
          exit "${{ steps.burnin_preflight.outputs.exit_code }}"

