name: AETHER vNext Burn-in Control Plane

on:
  workflow_dispatch:
    inputs:
      action:
        description: "initialize applies migrations/bootstrap; preflight is read-only"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - initialize_and_preflight
      campaign_id:
        description: "Forward-paper campaign identity to inspect"
        required: true
        type: string
      routes_json:
        description: 'JSON list: [{"route_id":"eurusd:intraday:long","playbook_id":"pb_fx_intraday_v1_2"}]'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aether-vnext-burnin-control-plane
  cancel-in-progress: false

jobs:
  burnin-control:
    runs-on: ubuntu-latest
    environment: aether-vnext-burnin
    defaults:
      run:
        working-directory: backend
    env:
      AETHER_VNEXT_ENVIRONMENT: burnin
      AETHER_VNEXT_DATABASE_URL: ${{ secrets.AETHER_VNEXT_BURNIN_DATABASE_URL }}
      AETHER_VNEXT_AZURE_POSTGRESQL_CONNECTIONSTRING: ${{ secrets.AETHER_VNEXT_BURNIN_POSTGRESQL_CONNECTIONSTRING }}

    steps:
      - name: Refuse production/default branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "vNext burn-in control plane may not run from main."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login for dedicated burn-in managed identity
        if: ${{ env.AETHER_VNEXT_AZURE_POSTGRESQL_CONNECTIONSTRING != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AETHER_VNEXT_BURNIN_CLIENT_ID }}
          tenant-id: ${{ secrets.AETHER_VNEXT_BURNIN_TENANT_ID }}
          subscription-id: ${{ secrets.AETHER_VNEXT_BURNIN_SUBSCRIPTION_ID }}

      - name: Validate isolated database configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from aether_vnext.db_runtime import VNextDatabaseConfig
          cfg = VNextDatabaseConfig.from_environment()
          print("vNext environment:", cfg.environment)
          print("connection mode:", "database-url" if cfg.database_url else "managed-identity")
          PY

      - name: Refuse legacy production database target
        env:
          PYTHONPATH: .
        run: python scripts/aether_vnext_check_db_isolation.py

      - name: Apply vNext schema migrations
        if: ${{ inputs.action == 'initialize_and_preflight' }}
        env:
          PYTHONPATH: .
        run: python scripts/aether_vnext_migrate.py

      - name: Bootstrap canonical policy snapshot
        if: ${{ inputs.action == 'initialize_and_preflight' }}
        env:
          PYTHONPATH: .
        run: python scripts/aether_vnext_bootstrap_policy.py

      - name: Run read-only burn-in preflight
        id: preflight
        env:
          PYTHONPATH: .
          AETHER_BURNIN_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          AETHER_BURNIN_ROUTES_JSON: ${{ inputs.routes_json }}
        shell: bash
        run: |
          set +e
          python scripts/aether_vnext_burnin_preflight.py \
            --campaign-id "$AETHER_BURNIN_CAMPAIGN_ID" \
            --routes-json "$AETHER_BURNIN_ROUTES_JSON" \
            --output aether-vnext-burnin-preflight.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload burn-in preflight report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aether-vnext-burnin-preflight-${{ github.run_id }}
          path: backend/aether-vnext-burnin-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagate preflight result
        if: ${{ steps.preflight.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "Burn-in preflight was not startable; inspect the uploaded JSON artifact."
          exit "${{ steps.preflight.outputs.exit_code }}"
